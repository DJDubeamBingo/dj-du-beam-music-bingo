<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DJ DU BEAM Music Bingo</title><link rel="stylesheet" href="styles.css"></head><body><div class="wrap"><img class="logo" src="logo.jpeg"><h1 class="title">MUSIC BINGO</h1><p class="sub">SCAN • LISTEN • MARK • WIN</p><section id="join" class="panel"><h2>Join Game</h2><input id="name" placeholder="Your name"><br><br><input id="code" placeholder="Game code e.g. DUBEAM-01"><br><br><button onclick="joinGame()">JOIN GAME →</button><p class="small">No app download. Your card is saved on this phone.</p></section><section id="game" class="panel hide"><div id="playerLine" class="status"></div><div class="headers"><div>B</div><div>I</div><div>N</div><div>G</div><div>O</div></div><div id="grid" class="grid"></div><br><button class="bingo" onclick="claimBingo()">🏆 CLAIM BINGO</button><div id="result"></div></section></div><script src="songs.js"></script><script>
const $=id=>document.getElementById(id);let card=[],marks=[];function seededShuffle(a,seed){let x=[...a],h=2166136261;for(const c of seed)h=(h^c.charCodeAt(0))*16777619>>>0;for(let i=x.length-1;i>0;i--){h=(h*1664525+1013904223)>>>0;let j=h%(i+1);[x[i],x[j]]=[x[j],x[i]]}return x}function joinGame(){let n=$('name').value.trim(),c=$('code').value.trim().toUpperCase();if(!n||!c)return alert('Enter your name and game code.');localStorage.duBeamPlayer=n;localStorage.duBeamCode=c;card=seededShuffle(window.DUBEAM_SONGS,n+'|'+c).slice(0,24);card.splice(12,0,'⭐ FREE SPACE ⭐');marks=Array(25).fill(false);marks[12]=true;render();$('join').classList.add('hide');$('game').classList.remove('hide');$('playerLine').innerHTML='<b>'+escapeHtml(n)+'</b> • '+escapeHtml(c)+' • Card #'+String(hash(n+c)%1000).padStart(3,'0')} }function render(){$('grid').innerHTML='';card.forEach((s,i)=>{let d=document.createElement('button');d.className='cell'+(marks[i]?' marked':'')+(i===12?' free':'');d.textContent=s;d.onclick=()=>{if(i!==12){marks[i]=!marks[i];render()}};$('grid').appendChild(d)})}function wins(){let lines=[];for(let r=0;r<5;r++)lines.push([0,1,2,3,4].map(x=>r*5+x));for(let c=0;c<5;c++)lines.push([0,1,2,3,4].map(x=>x*5+c));lines.push([0,6,12,18,24],[4,8,12,16,20]);return lines.some(l=>l.every(i=>marks[i]))}function claimBingo(){let r=$('result');if(wins()){r.className='status good';r.innerHTML='<b>🎉 BINGO CLAIM READY!</b><br>Show this card to DJ DU BEAM for host verification.'}else{r.className='status bad';r.innerHTML='<b>Not yet!</b> You need 5 marked squares in a row, column, or diagonal.'}}function hash(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return h}function escapeHtml(s){return s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}let p=localStorage.duBeamPlayer,c=localStorage.duBeamCode;if(p&&c){$('name').value=p;$('code').value=c}
</script></body></html>
